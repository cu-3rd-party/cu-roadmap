name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -av --delete docker-compose.yml backend frontend nginx $SSH_USER@$SSH_HOST:~/cu-roadmap

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST "cd ~/cu-roadmap && docker compose down || true"
          ssh $SSH_USER@$SSH_HOST "cd ~/cu-roadmap && docker compose up -d --build"
          ssh $SSH_USER@$SSH_HOST "cd ~/cu-roadmap && docker compose exec -T backend uv run src/scripts/ingest_csv.py"
          ssh $SSH_USER@$SSH_HOST "cd ~/cu-roadmap && docker compose exec -T backend uv run src/scripts/mock_data.py"
