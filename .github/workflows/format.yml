name: Format

on:
  push:
    branches: [master]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update backend lockfile
        run: |
          cd backend
          pip install uv
          uv lock

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify frontend lockfile
        run: |
          cd frontend
          pnpm install --lockfile-only

      - name: Check tracked changes
        run: git diff --exit-code -- backend/uv.lock frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Format backend
        run: |
          cd backend
          .venv/bin/ruff format .
          .venv/bin/ruff check --fix .

      - name: Check backend formatting
        run: git diff --exit-code -- backend

      - name: Check frontend formatting
        run: |
          cd frontend
          pnpm format:check
