name: Test Backend

on:
  push:
    paths:
      - backend/**
      - test-backend.yml
  pull_request:
    paths:
      - backend/**
      - test-backend.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest