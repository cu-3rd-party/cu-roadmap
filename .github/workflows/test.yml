name: Test

on:
  workflow_run:
    workflows: [Format]
    types: [completed]
    branches: [master]

jobs:
  test-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Resolve formatted commit
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          sha=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_branch }} --jq '.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  test-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Resolve formatted commit
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          sha=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_branch }} --jq '.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm test
