<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CU Roadmap - Course Dependencies Graph</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }
        #mynetwork {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .panel {
            position: absolute;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .header-panel {
            top: 24px;
            left: 24px;
            max-width: 350px;
            transition: transform 0.3s ease;
        }
        .header-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }
        .info-panel {
            top: 24px;
            right: 24px;
            width: 300px;
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: slideIn 0.3s forwards ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        h1 { margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 600; color: var(--text-main); }
        p { margin: 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
        .course-title { font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 8px;}
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
            width: max-content;
        }
    </style>
</head>
<body>

    <div class="panel header-panel">
        <h1>CU Course Map</h1>
        <p>Interactive Dependency Graph</p>
        <p style="margin-top: 10px; font-size: 0.8rem; color: var(--accent);">
            &#x2728; Drag to pan, scroll to zoom.<br>Click on a node for details.
        </p>
    </div>

    <div class="panel info-panel" id="infoPanel">
        <div id="infoBadge" class="badge">Category</div>
        <div class="course-title" id="infoTitle">Course Title</div>
        <p id="infoDesc">Course Description</p>
    </div>

    <div id="mynetwork"></div>

    <script>
        async function loadGraph() {
            try {
                const response = await fetch('/api/v1/graph-data');
                const data = await response.json();

                const colorMap = {
                    'tech': { background: '#3b82f6', border: '#2563eb' },
                    'stem': { background: '#8b5cf6', border: '#7c3aed' },
                    'business': { background: '#10b981', border: '#059669' },
                    'soft': { background: '#f59e0b', border: '#d97706' },
                };

                const nodes = new vis.DataSet(data.nodes.map(n => ({
                    id: n.id,
                    label: n.label,
                    title: n.title, // tooltip
                    group: n.group,
                    color: {
                        background: colorMap[n.group]?.background || '#64748b',
                        border: colorMap[n.group]?.border || '#475569',
                        highlight: { background: '#38bdf8', border: '#0ea5e9' }
                    },
                    font: { color: '#ffffff', face: 'Inter', size: 14 },
                    shape: 'box',
                    borderWidth: 2,
                    borderWidthSelected: 4,
                    shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 10, x: 2, y: 2 },
                    margin: 12,
                    customData: n
                })));

                const edges = new vis.DataSet(data.edges.map(e => ({
                    from: e.from,
                    to: e.to,
                    label: e.label.replace('corequisite_type1', 'Coreq 1').replace('corequisite_type2', 'Coreq 2').replace('prerequisite', 'Pre-req'),
                    arrows: 'to',
                    color: { color: 'rgba(148, 163, 184, 0.4)', highlight: '#38bdf8', hover: '#38bdf8' },
                    font: { align: 'middle', color: '#94a3b8', strokeWidth: 0, size: 11, face: 'Inter' },
                    smooth: { type: 'cubicBezier' },
                    dashes: e.label !== 'prerequisite'
                })));

                const container = document.getElementById('mynetwork');
                const graphData = { nodes: nodes, edges: edges };
                const options = {
                    physics: {
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: {
                            gravitationalConstant: -100,
                            centralGravity: 0.01,
                            springLength: 200,
                            springConstant: 0.08
                        },
                        maxVelocity: 50,
                        minVelocity: 0.1,
                        timestep: 0.5
                    },
                    interaction: {
                        hover: true,
                        tooltipDelay: 200
                    }
                };

                const network = new vis.Network(container, graphData, options);
                
                const infoPanel = document.getElementById('infoPanel');
                const infoTitle = document.getElementById('infoTitle');
                const infoDesc = document.getElementById('infoDesc');
                const infoBadge = document.getElementById('infoBadge');

                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const node = nodes.get(nodeId);
                        infoTitle.innerText = node.label;
                        infoDesc.innerText = node.customData.title || "No description available.";
                        infoBadge.innerText = node.group.toUpperCase();
                        
                        // Restart animation by cloning
                        const newPanel = infoPanel.cloneNode(true);
                        infoPanel.parentNode.replaceChild(newPanel, infoPanel);
                        newPanel.style.display = 'flex';
                        
                        // Update references
                        newPanel.id = 'infoPanel';
                    } else {
                        document.getElementById('infoPanel').style.display = 'none';
                    }
                });
            } catch (error) {
                console.error("Error loading graph data:", error);
            }
        }
        loadGraph();
    </script>
</body>
</html>
