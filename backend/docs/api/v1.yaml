openapi: 3.1.0
info:
  title: cu roadmap api v1
  description: cu roadmap api v1
  version: 1.1.0
servers:
  - url: https://roadmap.cu3rd.ru
  - url: http://localhost:8080

paths:
  /:
    description: тут висит админ панелька. ее открыть на реальном апи невозможно.

  /api/health:
    description: статус сервера
    get:
      responses:
        '200':
          description: все хорошо
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: я еще не успел бд инициализировать, или я сейчас синхронизируюсь с гугл щитами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/graph/data:
    description: возвращает информацию, которая используется для графа
    get:
      responses:
        '200':
          description: все прошло хорошо
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphData'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/courses/:
    description: операции с курсами
    get:
      description: |
        возвращает все курсы с пререквизитами.
        поддерживает опциональную фильтрацию через query-параметры.
      parameters:
        - $ref: '#/components/parameters/CohortYears'
        - $ref: '#/components/parameters/CourseTitle'
        - $ref: '#/components/parameters/CourseTypes'
        - $ref: '#/components/parameters/CourseCategories'
        - $ref: '#/components/parameters/CourseWorkload'
      responses:
        '200':
          description: на держи вообще все курсы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    post:
      description: создает курс
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
      responses:
        '201':
          description: курс создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/courses/{cohort_year}:
    description: операции с курсами, отфильтрованными по году поступления или по мейджору
    get:
      description: |
        возвращает курсы, доступные для указанного года поступления.
        курс включается в результат, если у него нет ограничений по годам
        (allowed_cohorts пуст) или указанный год есть в allowed_cohorts.
        path-параметр cohort_year работает как значение по умолчанию;
        query-параметр cohort_year переопределяет его.
        Для мейджор-специфичной классификации используйте маршрут
        /api/v1/courses/{cohort_year}/{major_id}.
      parameters:
        - name: cohort_year
          in: path
          required: true
          schema:
            type: integer
          description: год поступления (например, 2025)
        - $ref: '#/components/parameters/CohortYears'
        - $ref: '#/components/parameters/CourseTitle'
        - $ref: '#/components/parameters/CourseTypes'
        - $ref: '#/components/parameters/CourseCategories'
        - $ref: '#/components/parameters/CourseWorkload'
      responses:
        '200':
          description: отфильтрованный список курсов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/courses/{cohort_year}/{major_id}:
    description: операции с курсами для конкретного года поступления и мейджора
    get:
      description: |
        возвращает курсы для указанного года поступления и дополнительно
        классифицирует их относительно переданного мейджора.
        В ответе появляются поля by_major_type и specializations,
        связанные с этим мейджором.
      parameters:
        - name: cohort_year
          in: path
          required: true
          schema:
            type: integer
          description: год поступления (например, 2025)
        - name: major_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID мейджора, для которого нужно получить классификацию
        - $ref: '#/components/parameters/CohortYears'
        - $ref: '#/components/parameters/CourseTitle'
        - $ref: '#/components/parameters/CourseTypes'
        - $ref: '#/components/parameters/CourseCategories'
        - $ref: '#/components/parameters/CourseWorkload'
      responses:
        '200':
          description: отфильтрованный список курсов с мейджор-специфичной классификацией
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: мейджор не найден
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/courses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      description: обновляет курс
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
      responses:
        '200':
          description: курс обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: удаляет курс
      security:
        - AdminCookie: []
      responses:
        '200':
          description: курс удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/courses/backup:
    get:
      description: делает бэкап текущих курсов и мейджоров в json файлы
      security:
        - AdminCookie: []
      responses:
        '200':
          description: бэкап успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/courses/restore:
    post:
      description: восстанавливает курсы и мейджоры из json файлов, стирая текущие данные
      security:
        - AdminCookie: []
      responses:
        '200':
          description: данные успешно восстановлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/majors/:
    description: возвращает все мейджоры с требованиями
    get:
      responses:
        '200':
          description: ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Major'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    post:
      description: создает новый мейджор
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MajorUpdateRequest'
      responses:
        '200':
          description: мейджор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/majors/{cohort_year}:
    parameters:
      - name: cohort_year
        in: path
        required: true
        schema:
          type: integer
        description: год поступления, для которого фильтруются требования мейджоров
    get:
      description: возвращает все мейджоры, отфильтрованные по году поступления
      responses:
        '200':
          description: ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Major'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/majors/specializations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      description: возвращает список специализаций для конкретного мейджора
      responses:
        '200':
          description: список специализаций
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    major_id:
                      type: string
                      format: uuid
                    title:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/majors/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      description: обновляет мейджор
      security:
        - AdminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MajorUpdateRequest'
      responses:
        '200':
          description: мейджор обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/majors/identify:
    description: анализирует куда соответствуешь
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyMajorRequest'
      responses:
        '200':
          description: все ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MajorMatchResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/majors/identify/{cohort_year}:
    description: анализирует куда соответствуешь для конкретного года поступления
    post:
      parameters:
        - name: cohort_year
          in: path
          required: true
          schema:
            type: integer
          description: год поступления, для которого фильтруются требования мейджоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyMajorRequest'
      responses:
        '200':
          description: все ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MajorMatchResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/majors/identify-specializations:
    description: анализирует куда соответствуешь (с детализацией до специализаций). Если в запросе передан major_id, анализ ограничивается только этим мейджором; иначе рассматриваются все мейджоры для указанного cohort_year
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyMajorRequest'
            examples:
              without_major_filter:
                summary: без фильтра по мейджору
                value:
                  passed_course_ids:
                    - 6aad3927-b012-458c-a0ec-3ad142fa8ae2
                  current_semester: 1
              with_major_filter:
                summary: только для конкретного мейджора
                value:
                  passed_course_ids:
                    - 6aad3927-b012-458c-a0ec-3ad142fa8ae2
                  current_semester: 1
                  major_id: 3c71b6fd-bf6e-4b02-b624-8c8bfb8344db
      responses:
        '200':
          description: все ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecializationMatchResult'
              examples:
                default:
                  summary: пример ответа
                  value:
                    - id: fb207075-ec2b-42c1-8ac4-9a2e89e0b986
                      major_id: 3c71b6fd-bf6e-4b02-b624-8c8bfb8344db
                      title: Системная разработка
                      cohort_year: 2025
                      score: 0
                      covered_count: 0
                      can_cover_count: 16
                      total_count: 16
                      is_core: false
                      completed_ids: []
                      can_cover_ids: []
                      cannot_cover_ids: []
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/majors/identify-specializations/{cohort_year}:
    description: анализирует куда соответствуешь для конкретного года поступления (с детализацией до специализаций). Если в запросе передан major_id, анализ ограничивается только этим мейджором; иначе рассматриваются все мейджоры для указанного cohort_year
    post:
      parameters:
        - name: cohort_year
          in: path
          required: true
          schema:
            type: integer
          description: год поступления, для которого фильтруются требования мейджоров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyMajorRequest'
            examples:
              without_major_filter:
                summary: без фильтра по мейджору
                value:
                  passed_course_ids:
                    - 6aad3927-b012-458c-a0ec-3ad142fa8ae2
                  current_semester: 1
              with_major_filter:
                summary: только для конкретного мейджора
                value:
                  passed_course_ids:
                    - 6aad3927-b012-458c-a0ec-3ad142fa8ae2
                  current_semester: 1
                  major_id: 3c71b6fd-bf6e-4b02-b624-8c8bfb8344db
      responses:
        '200':
          description: все ок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecializationMatchResult'
              examples:
                default:
                  summary: пример ответа
                  value:
                    - id: fb207075-ec2b-42c1-8ac4-9a2e89e0b986
                      major_id: 3c71b6fd-bf6e-4b02-b624-8c8bfb8344db
                      title: Системная разработка
                      cohort_year: 2025
                      score: 0
                      covered_count: 0
                      can_cover_count: 16
                      total_count: 16
                      is_core: false
                      completed_ids: []
                      can_cover_ids: []
                      cannot_cover_ids: []
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/planner/generate:
    description: возвращает роадмапу (для конкретного мейджора)
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGenerateRequest'
      responses:
        '200':
          description: вот держи роадмапу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerGenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/planner/validate-semester/:
    description: валидирует семестр
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSemesterRequest'
      responses:
        '200':
          description: лови
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/planner/validate-roadmap/:
    description: валидирует роадмапу
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRoadmapRequest'
      responses:
        '200':
          description: лови
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/planner/goal-path/:
    description: валидирует роадмапу (для конкретного курса)
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalPathRequest'
      responses:
        '200':
          description: держи роадмапу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPathResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/login:
    description: аутентификация администратора
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  required: true
      responses:
        '201':
          description: успешный вход, токен установлен в HttpOnly cookie `auth-token`
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "auth-token=<uuid>; Path=/; HttpOnly; Secure; SameSite=Strict"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/check:
    description: no-op эндпоинт для проверки аутентификации
    get:
      description: соответственно проверка
      security:
        - AdminCookie: []
      responses:
        '200':
          description: На удивление эндпоинт ничего не возвращает, только статус что ок
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/logout:
    description: завершает админскую сессию
    delete:
      description: удаляет текущий auth-token из серверного cache-store
      security:
        - AdminCookie: []
      responses:
        '200':
          description: выход выполнен успешно
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: auth-token
      description: |
        HttpOnly cookie, устанавливается после успешного `POST /api/v1/auth/login`.
        Токен — UUIDv4, живёт 1 час.
        Для завершения сессии используется `DELETE /api/v1/auth/logout`.
        В production устанавливается с флагами `Secure; HttpOnly; SameSite=Strict`.
        В dev-режиме (gin debug) без `Secure`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CohortYears:
      name: cohort_year
      in: query
      required: false
      schema:
        type: string
      description: >
        фильтр по годам поступления (через запятую).
        курс включается, если у него пуст allowed_cohorts или есть совпадение.
        пример: `?cohort_year=2024,2025`

    CourseTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
      description: >
        фильтр по названию курса (регистронезависимое вхождение подстроки).
        пример: `?title=обр`

    CourseTypes:
      name: course_type
      in: query
      required: false
      schema:
        type: string
      description: >
        фильтр по типу курса (через запятую).
        допустимые значения: mandatory, elective, other.
        пример: `?course_type=mandatory,elective`

    CourseCategories:
      name: category
      in: query
      required: false
      schema:
        type: string
      description: >
        фильтр по категории курса (через запятую).
        допустимые значения: fundamentals, ai, stem, soft, business, tech, swe, design.
        пример: `?category=ai,stem`

    CourseWorkload:
      name: workload
      in: query
      required: false
      schema:
        type: string
      description: >
        фильтр по нагрузке с оператором сравнения.
        формат: `<значение`, `=значение` или `>значение`.
        пример: `?workload=<5`

  responses:
    BadRequestError:
      description: чето ты хуйню какую-то написал в body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: не прошел админскую авторизацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: запрошенный ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: чето не получилось к бд обратиться
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableError:
      description: еще не успели отпарсить таблицу
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    IdResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid

    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    MajorRequirement:
      description: что надо для получения
      type: object
      properties:
        course_id:
          type: string
          format: uuid
          description: какой курс надо пройти
        type:
          type: string
          description: тип требования
          enum:
            - major_core
            - major_choice
            - flex
            - university
            - elective
            - minor
            - soft
            - selected_topics
        specializations:
          type: array
          description: список специализаций, для которых применяется это требование
          items:
            type: string

    Major:
      description: мейджор
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: уникальынй айди мейджора
        title:
          type: string
          description: название мейджора
        internal_name:
          type: string
          description: внутреннее имя мейджора, например ai, swe, business
        school:
          type: string
          description: название школы
        cohort_year:
          type: integer
          description: год поступления, к которому относится мейджор
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/MajorRequirement'

    MajorRequirementWrite:
      type: object
      required:
        - course_id
        - type
      properties:
        course_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - major_core
            - major_choice
            - flex
            - university
            - elective
            - minor
            - soft
            - selected_topics

    MajorUpdateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        school:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/MajorRequirementWrite'

    MajorMatchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: айди мейджора
        title:
          type: string
          description: название мейджора
        score:
          type: number
          description: литералли covered_count/total_count
        covered_count:
          type: integer
        can_cover_count:
          type: integer
        total_count:
          type: integer

    SpecializationMatchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: айди специализации (или мейджора, если специализаций нет)
        major_id:
          type: string
          format: uuid
          description: айди мейджора
        title:
          type: string
          description: название специализации (например, Бизнес и аналитика - Системный анализ)
        cohort_year:
          type: integer
          description: год поступления
        score:
          type: number
          description: литералли covered_count/total_count
        covered_count:
          type: integer
        can_cover_count:
          type: integer
        total_count:
          type: integer
        is_core:
          type: boolean
          description: true, если элемент описывает обязательные дисциплины (Core) направления, а не специализацию
        completed_ids:
          type: array
          items:
            type: string
            format: uuid
        can_cover_ids:
          type: array
          items:
            type: string
            format: uuid
        cannot_cover_ids:
          type: array
          items:
            type: string
            format: uuid


    IdentifyMajorRequest:
      description: запрос может быть или массивом UUID пройденных курсов, или объектом с текущим семестром и необязательным фильтром по мейджору
      anyOf:
        - type: array
          items:
            type: string
            format: uuid
        - type: object
          properties:
            passed_course_ids:
              type: array
              description: UUID реально пройденных курсов
              items:
                type: string
                format: uuid
            current_semester:
              type: integer
              description: текущий семестр студента (по умолчанию 1)
            major_id:
              type: string
              format: uuid
              description: необязательный UUID мейджора; если указан, анализ выполняется только для него, иначе — для всех мейджоров подходящего cohort_year

    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: уникальный id курса
        title:
          type: string
          description: название курса
        description:
          type: string
          description: описание курса
          nullable: true
        handbook_link:
          type: string
          description: ссылка на хэндбук курса
          nullable: true
        course_type:
          type: string
          description: тип курса
          enum:
            - mandatory
            - elective
            - other
        category:
          type: string
          description: >-
            категория курса. Если в path передан UUID мейджора и курс относится
            к этому мейджору как major core или major choice, значение
            переопределяется внутренним именем мейджора (ai/business/swe).
          enum:
            - fundamentals
            - ai
            - stem
            - soft
            - business
            - tech
            - swe
            - design
        available_semesters:
          type: array
          items:
            type: integer
        allowed_cohorts:
          type: array
          items:
            type: integer
        recommended_semester:
          type: integer
          nullable: true
        workload:
          type: number
        analog_group:
          type: string
          nullable: true
          description: группа аналогичных курсов
        fixed_semester:
          type: integer
          description: >-
            фиксированный семестр для автодобавления в план, если курс является
            единственным курсом в обязательной analog group и имеет ровно один
            доступный семестр; в остальных случаях 0
        prerequisites:
          type: array
          description: >-
            список групп пререквизитов курса. Каждая группа представлена как
            объект {group_id, course_ids}. Идентификаторы групп назначаются
            последовательно по порядку появления группы в ответе.
          items:
            type: object
            required:
              - group_id
              - course_ids
            properties:
              group_id:
                type: integer
                description: id группы пререквизитов
              course_ids:
                type: array
                items:
                  type: string
                  format: uuid
        corequisites:
          type: array
          description: uuid курсов, которые являются кореквизитами для конкретного
          items:
            type: string
            format: uuid
        postrequisites:
          type: array
          description: uuid курсов, которые являются пререквизитами перед конкретным
          items:
            type: string
            format: uuid
        specializations:
          type: array
          description: uuid специализаций, к которым относится курс
          items:
            type: string
            format: uuid
        by_major_type:
          type: string
          description: >-
            дополнительная классификация курса относительно конкретного мейджора,
            если в path передан UUID мейджора; значения: core, choice, elective, other.
            Для major core/major choice также переопределяется поле category
            внутренним именем мейджора.
          enum:
            - core
            - choice
            - elective
            - other
        to_major:
          type: object
          description: |
            маппинг id мажора → тип требования, показывающий для каких мажоров
            данный курс является требованием и какого типа
          additionalProperties:
            type: string
            enum:
              - major_core
              - major_choice
              - flex
              - university
              - elective
              - minor
              - soft
              - selected_topics

    CourseWriteRequest:
      type: object
      required:
        - title
        - course_type
        - category
        - allowed_cohorts
        - available_semesters
        - workload
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        handbook_link:
          type: string
          nullable: true
        course_type:
          type: string
          enum:
            - mandatory
            - elective
            - other
        category:
          type: string
          enum:
            - fundamentals
            - ai
            - stem
            - soft
            - business
            - tech
            - swe
            - design
        allowed_cohorts:
          type: array
          items:
            type: integer
        available_semesters:
          type: array
          items:
            type: integer
        recommended_semester:
          type: integer
          nullable: true
        workload:
          type: number
        prerequisites:
          type: array
          description: >-
            список групп пререквизитов курса. Каждая группа представлена как
            объект {group_id, course_ids}. Идентификаторы групп назначаются
            последовательно по порядку появления группы в ответе.
          items:
            type: object
            required:
              - group_id
              - course_ids
            properties:
              group_id:
                type: integer
                description: id группы пререквизитов
              course_ids:
                type: array
                items:
                  type: string
                  format: uuid
        corequisites:
          type: array
          items:
            type: string
            format: uuid

    GraphNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: уникальный id курса
        label:
          type: string
          description: title курса
        group:
          type: string
          description: категория курса
          enum:
            - fundamentals
            - ai
            - stem
            - soft
            - business
            - tech
            - design
        description:
          type: string
          description: описание курса
          nullable: true
        recommended_semester:
          type: string
          description: соответственно рекомендованный семестр
          nullable: true

    GraphEdge:
      type: object
      properties:
        from:
          type: string
          format: uuid
          description: откуда
        to:
          type: string
          format: uuid
          description: куда
        label:
          type: string
          description: тип связи
          enum:
            - prerequisite
            - corequisite

    GraphData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

    PlannerGenerateRequest:
      type: object
      required:
        - passed_course_ids
        - major_id
      properties:
        passed_course_ids:
          type: array
          description: UUID реально пройденных курсов
          items:
            type: string
            format: uuid
        selected_course_ids:
          type: array
          description: Курсы, которые пользователь жестко запланировал в конкретные будущие семестры
          items:
            type: object
            properties:
              semester:
                type: integer
              course_ids:
                type: array
                items:
                  type: string
                  format: uuid
        course_source:
          type: string
          description: какие курсы использовать как уже учтенные при генерации
          enum:
            - passed
            - selected
          default: passed
        major_id:
          type: string
          format: uuid
          description: UUID мейджора куда стремишься
        specialization_id:
          type: string
          format: uuid
          description: UUID специализации мейджора (если есть)
          nullable: true
        current_semester:
          type: integer
          description: измеряется в кредитах, по дефолту 1
        max_load:
          type: number
          description: измеряется в кредитах, по дефолту 12.0
        cohort:
          type: integer
          description: год, когда поступил в цу

    RoadmapSemester:
      type: object
      properties:
        semester:
          type: integer
        total_load:
          type: number
        error:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        course_ids:
          type: array
          description: используется в ответе goal-path, содержит UUID курсов которые надо пройти
          items:
            type: string
            format: uuid
            description: молимся что на фронте все курсы будут

    PlannerRoadmapSemester:
      type: object
      properties:
        semester:
          type: integer
        total_load:
          type: number
        error:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        course_ids:
          type: array
          description: список UUID курсов, детали фронт подтягивает сам
          items:
            type: string
            format: uuid

    PlannerRoadmap:
      type: array
      items:
        $ref: '#/components/schemas/PlannerRoadmapSemester'

    GoalPathRoadmap:
      type: array
      items:
        $ref: '#/components/schemas/PlannerRoadmapSemester'

    Roadmap:
      type: array
      items:
        $ref: '#/components/schemas/RoadmapSemester'

    PlannerGenerateResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
          description: если чето пойдет не так при генерации тут будет ошибка
        major_id:
          type: string
          format: uuid
        roadmap:
          $ref: '#/components/schemas/PlannerRoadmap'

    ValidationMessage:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
          description: >
            Текст ошибки валидации. Может включать сообщения о том, что курс
            обязателен к прохождению в текущем семестре, отсутствует пререквизит,
            нарушен порядок семестров и т.д.
        course_id:
          type: string
          format: uuid
          nullable: true

    ValidateSemesterRequest:
      type: object
      properties:
        current_semester:
          type: integer
        course_ids:
          type: array
          items:
            type: string
            format: uuid
        passed_course_ids:
          type: array
          items:
            type: string
            format: uuid
        max_load:
          type: number
          default: 12.0

    SemesterValidationResponse:
      type: object
      properties:
        is_valid:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
        total_load:
          type: number

    ValidateRoadmapRequest:
      type: object
      properties:
        max_load:
          type: number
          default: 12.0
        major_id:
          type: string
          format: uuid
          nullable: true
        specialization_id:
          type: string
          format: uuid
          nullable: true
        current_semester:
          type: integer
          default: 1
          description: >
            Текущий семестр студента. Курсы в семестрах меньше этого значения
            считаются уже пройденными (passed) и не валидируются, но учитываются
            как выполненные пререквизиты для последующих семестров. Для семестров,
            равных текущему, валидатор также может сообщать о курсах, которые
            обязательны к прохождению именно в этом семестре.
        roadmap:
          type: array
          items:
            type: object
            properties:
              semester:
                type: integer
              course_ids:
                type: array
                items:
                  type: string
                  format: uuid

    RoadmapValidationResult:
      type: object
      properties:
        semester:
          type: integer
        valid:
          type: boolean
        total_load:
          type: number
        messages:
          type: array
          description: >
            Список сообщений валидации для данного семестра. Включает как обычные
            ошибки (например, пререквизиты), так и сообщения о курсах, обязательных
            к прохождению в этом семестре.
          items:
            $ref: '#/components/schemas/ValidationMessage'

    RoadmapValidationResponse:
      type: object
      properties:
        validation_results:
          type: array
          items:
            $ref: '#/components/schemas/RoadmapValidationResult'

    GoalPathRequest:
      type: object
      properties:
        target_course_id:
          type: string
          format: uuid
        passed_course_ids:
          type: array
          items:
            type: string
            format: uuid
        current_semester:
          type: integer
          default: 1
        max_load:
          type: number
          default: 12.0
        goal_semester:
          type: integer
          description: желаемый семестр для прохождения целевого курса
          nullable: true

    GoalPathResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
          description: если чето пойдет не так при генерации тут будет ошибка
        roadmap:
          $ref: '#/components/schemas/GoalPathRoadmap'
