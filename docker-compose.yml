services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "9679:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_USER: roadmap_user
      POSTGRES_PASSWORD: roadmap_password
      POSTGRES_DB: roadmap_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SEED_ON_STARTUP: "true"
      USE_MEMORY_STORE: "true"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    restart: unless-stopped

networks:
  default:
    name: cu-roadmap

volumes:
  pgdata: